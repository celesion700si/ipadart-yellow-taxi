<div class="progress-row"><span id="stepLabel">準備開始</span><div id="progress" role="progressbar" aria-label="組裝進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><span id="percent">0%</span></div>

</section>
